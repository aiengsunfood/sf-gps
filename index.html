<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>เช็คอิน GPS</title>
<style>
  :root { --brand: #2f6f4f; --mint: #d1f0dc; --ink: #163628; --muted: #63636b; --bg: #f3f6f4; --bad: #b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
  main { width: 100%; max-width: 360px; background: #fff; border-radius: 20px; padding: 28px 22px; text-align: center;
         box-shadow: 0 1px 2px rgb(22 54 40 / .05), 0 4px 16px -6px rgb(22 54 40 / .1); }
  .ico { width: 56px; height: 56px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 16px; background: var(--mint); color: var(--brand); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .big { margin: 14px 0 4px; padding: 10px; border-radius: 12px; background: var(--bg); font: 600 15px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); word-break: break-all; }
  button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: 600 16px/1 inherit; font-family: inherit; }
  button.ghost { background: #fff; color: var(--brand); box-shadow: inset 0 0 0 1px #bad8c6; }
  .bad { color: var(--bad); }
  .spin { width: 22px; height: 22px; border: 3px solid var(--mint); border-top-color: var(--brand); border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #map { display: block; width: 100%; height: 200px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--bg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="ico" id="ico"><div class="spin"></div></div>
  <h1 id="title">กำลังหาตำแหน่ง…</h1>
  <p id="msg">อนุญาตให้ใช้ตำแหน่งถ้ามีถาม</p>
  <iframe id="map" title="แผนที่ตำแหน่ง" hidden></iframe>
  <div class="big" id="text" hidden></div>
  <button id="copy" hidden>คัดลอก แล้วกลับไปวางในช่องตำแหน่ง</button>
  <button id="retry" class="ghost" hidden>ลองใหม่</button>
</main>
<script>
/* หน้าช่วยเช็คอิน GPS ของ Sale Feed — ระบบหลักเป็น http มือถือไม่ให้อ่าน GPS จึงอ่านที่หน้านี้ (https) แล้วส่งกลับ
   #o=ต้นทาง &k=รหัสสุ่ม &b=ที่อยู่ระบบ → ได้ตำแหน่งแล้วเปิด b?r=gps/drop#k=..&t=.. (ข้อความอยู่หลัง # ไม่ถูกส่งไปที่ไหนนอกจากเว็บต้นทาง)
   ส่งกลับได้เฉพาะเว็บในรายชื่อ (กันเว็บอื่นเปิดหน้านี้แอบเอาตำแหน่ง) · ไม่เก็บ/ไม่ส่งข้อมูลไปที่อื่น
   เปิดเป็นหน้าต่างใหม่ (window.open) → postMessage กลับ แล้วปิดตัวเอง · ไม่มีหน้าต่างแม่ (แอปบนหน้าจอโฮม/LINE) → คัดลอกข้อความไปวางเอง */
(function () {
  var ALLOW = ['http://dss.sungroup.co.th', 'https://dss.sungroup.co.th', 'http://172.16.4.5', 'https://172.16.4.5', 'http://203.130.137.158'];
  var arg = function (n) { var m = location.hash.match(new RegExp('[#&]' + n + '=([^&]+)')); try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; } };
  var o = arg('o'), k = arg('k'), b = arg('b');
  var parent = window.opener && ALLOW.indexOf(o) >= 0 ? window.opener : null;
  // คลิกเดียว: ส่งกลับเว็บต้นทางเอง (หน้า ?r=gps/drop เก็บไว้ให้ฟอร์มดึง) — ใช้ได้แม้ไม่มีหน้าต่างแม่ (แอปบนหน้าจอโฮม/LINE)
  var back = /^[0-9a-f]{32}$/.test(k) && ALLOW.some(function (a) { return b.indexOf(a + '/') === 0; }) ? b : '';
  var $ = function (id) { return document.getElementById(id); };
  var best = null, watch = null, timer = null;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  function textOf(p) {   // รูปแบบเดียวกับที่ระบบอ่าน (Geo::gps): GPS lat,lng ±Nm YYYY-MM-DD HH:MM
    var t = new Date(p.timestamp || Date.now());
    return 'GPS ' + p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6) + ' ±' + Math.max(1, Math.round(p.coords.accuracy)) + 'm '
         + t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()) + ' ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
  }
  function done() {
    if (watch !== null) navigator.geolocation.clearWatch(watch);
    clearTimeout(timer);
    watch = null;
    if (!best) return;
    var text = textOf(best), acc = Math.round(best.coords.accuracy);
    $('ico').innerHTML = '✓';
    $('title').textContent = 'ได้ตำแหน่งแล้ว ±' + acc + ' ม.';
    $('text').textContent = text;
    $('text').hidden = false;
    $('retry').hidden = false;
    if (back) {
      $('msg').textContent = 'กำลังส่งเข้าฟอร์ม…';
      location.replace(back + '?r=gps/drop#k=' + k + '&t=' + encodeURIComponent(text));
      return;
    }
    if (parent) {   // ลิงก์รุ่นเก่าที่ไม่มีรหัส
      try {
        parent.postMessage({ type: 'sf-gps', text: text, acc: acc }, o);
        $('msg').textContent = 'ส่งเข้าฟอร์มแล้ว กำลังกลับ…';
        setTimeout(function () { window.close(); }, 700);
        return;
      } catch (e) {}
    }
    $('map').src = 'https://www.google.com/maps?q=' + best.coords.latitude.toFixed(6) + ',' + best.coords.longitude.toFixed(6) + '&z=16&output=embed';   // หมุดตรงที่อยู่
    $('map').hidden = false;
    // บอกสาเหตุที่ส่งกลับเองไม่ได้ (ช่วยหาปัญหา): ไม่มีรหัส = หน้าฟอร์มยังเป็นรุ่นเก่า · มีรหัสแต่เว็บไม่อยู่ในรายชื่อ = เปิดระบบด้วยชื่อเว็บอื่น
    $('msg').textContent = !k ? 'หน้าฟอร์มยังเป็นรุ่นเก่า — กลับไปโหลดหน้าฟอร์มใหม่ แล้วกดเช็คอินอีกครั้ง (หรือคัดลอกไปวางตอนนี้)'
      : 'ส่งกลับเองไม่ได้ (' + (b.split('/')[2] || 'ไม่ทราบเว็บ') + ') — กดคัดลอก แล้วกลับไปวางในช่อง "ตำแหน่ง"';
    $('copy').hidden = false;
  }
  function fail(err) {
    if (best) return done();
    if (watch !== null) navigator.geolocation.clearWatch(watch);
    clearTimeout(timer);
    watch = null;
    $('ico').innerHTML = '!';
    $('title').innerHTML = '<span class="bad">หาตำแหน่งไม่ได้</span>';
    $('msg').textContent = err && err.code === 1
      ? 'ยังไม่ได้อนุญาตตำแหน่ง — เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์ในการตั้งค่ามือถือ แล้วกดลองใหม่'
      : 'เปิด GPS ของมือถือ หรือออกไปที่โล่ง แล้วกดลองใหม่';
    $('retry').hidden = false;
  }
  function start() {
    best = null;
    $('ico').innerHTML = '<div class="spin"></div>';
    $('title').textContent = 'กำลังหาตำแหน่ง…';
    $('msg').textContent = 'อนุญาตให้ใช้ตำแหน่งถ้ามีถาม';
    $('text').hidden = $('copy').hidden = $('retry').hidden = $('map').hidden = true;
    if (!navigator.geolocation) return fail(null);
    // อ่านหลายครั้ง เก็บค่าที่แม่นสุด: แม่นถึง 30 ม. = พอ · ไม่ถึง = ใช้ค่าที่ดีที่สุดใน 12 วินาที
    watch = navigator.geolocation.watchPosition(function (p) {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      $('msg').textContent = 'ความแม่นยำตอนนี้ ±' + Math.round(best.coords.accuracy) + ' ม.';
      if (best.coords.accuracy <= 30) done();
    }, fail, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    timer = setTimeout(function () { best ? done() : null; }, 12000);
  }
  $('retry').onclick = start;
  $('copy').onclick = function () {
    var t = $('text').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () {
      $('copy').textContent = 'คัดลอกแล้ว ✓ กลับไปวางได้เลย';
    }, function () {
      var r = document.createRange(); r.selectNodeContents($('text'));
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      $('copy').textContent = 'กดค้างที่ข้อความแล้วเลือกคัดลอก';
    });
  };
  start();
})();
</script>
</body>
</html>
